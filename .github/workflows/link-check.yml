name: External link check

# Deliberately NOT run on pull_request. Third-party hosts rate-limit and
# blip, and a flaky required check teaches people to ignore CI. A weekly
# failure here is visible in the Actions tab without blocking anyone.
on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check external URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check external links
        run: python3 .github/scripts/check_external_links.py
